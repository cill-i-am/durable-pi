name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [static, unit-and-build, native-runtime]
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        if: matrix.suite == 'static'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive" \
            --output "$install_dir/$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$install_dir/$archive" | sha256sum --check --strict
          tar -xzf "$install_dir/$archive" -C "$install_dir" actionlint
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflows
        if: matrix.suite == 'static'
        run: actionlint
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.suite }} checks
        run: pnpm verify:${{ matrix.suite }}
  check:
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every verification suite to pass
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://bot.cill-i-am.com
    concurrency:
      group: durable-pi-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy production with Alchemy
        run: |
          pnpm exec alchemy provider check-env --provider Cloudflare --no-input
          pnpm run deploy --yes --no-input
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OPENAI_CREDENTIAL: ${{ secrets.OPENAI_CREDENTIAL }}
      - name: Configure native issue detection
        run: node --import tsx scripts/configure-observability.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify hosted authentication boundary
        run: node --import tsx scripts/check-deployment.ts
        env:
          APP_URL: https://bot.cill-i-am.com
          LEGACY_APP_URL: https://durable-pi-website-production-ymvgn6wvhopg5b2y.barroncillian.workers.dev
