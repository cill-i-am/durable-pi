name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [static, unit-and-build, native-runtime, browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint
        if: matrix.suite == 'static'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive" \
            --output "$install_dir/$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$install_dir/$archive" | sha256sum --check --strict
          tar -xzf "$install_dir/$archive" -C "$install_dir" actionlint
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflows
        if: matrix.suite == 'static'
        run: actionlint
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        if: matrix.suite == 'browser'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install complexity reporter
        if: matrix.suite == 'static'
        uses: moznion/cccc-action@1d5313811f8451953e46a268c61791a01e40b7df # v1
        with:
          version: v1.8.3
      - name: Report cognitive and cyclomatic complexity
        if: matrix.suite == 'static'
        run: |
          pnpm --silent complexity:report > "$RUNNER_TEMP/complexity.json"
          cccc --top-cognitive 25 --table src >> "$GITHUB_STEP_SUMMARY"
      - name: Retain complexity report
        if: matrix.suite == 'static'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complexity-report
          path: ${{ runner.temp }}/complexity.json
          retention-days: 14
          if-no-files-found: error
      - name: Run ${{ matrix.suite }} checks
        run: pnpm verify:${{ matrix.suite }}
      - name: Retain browser failure traces
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
  container:
    name: container (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: [terminal, terminal-native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check container inputs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTAINER_IMAGE: ${{ matrix.image }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet "$BASE_SHA" HEAD -- "containers/$CONTAINER_IMAGE" .github/workflows/check.yml; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build terminal and run media checks
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/${{ matrix.image }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}-linux-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-linux-amd64
  check:
    if: ${{ always() }}
    needs: [verify, container]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every verification suite to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$CONTAINER_RESULT" = success
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://bot.cill-i-am.com
    concurrency:
      group: durable-pi-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy production with Alchemy
        run: |
          pnpm exec alchemy provider check-env --provider Cloudflare --no-input
          pnpm run deploy --yes --no-input
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AGENT_EMAIL_DOMAIN: ${{ vars.AGENT_EMAIL_DOMAIN }}
          EMAIL_ADDRESS_SECRET: ${{ secrets.EMAIL_ADDRESS_SECRET }}
          EMAIL_REVIEW_URL: ${{ vars.EMAIL_REVIEW_URL }}
          OPENAI_CREDENTIAL: ${{ secrets.OPENAI_CREDENTIAL }}
      - name: Configure native issue detection
        run: node --import tsx scripts/configure-observability.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify hosted authentication boundary
        run: node --import tsx scripts/check-deployment.ts
        env:
          APP_URL: https://bot.cill-i-am.com
          LEGACY_APP_URL: https://durable-pi-website-production-ymvgn6wvhopg5b2y.barroncillian.workers.dev
